<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garment Manager">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Garment Order Manager</title>
<style>
:root{--ink:#172b27;--muted:#687873;--brand:#173b35;--accent:#d9a441;--bg:#f4f6f3;--card:#fff;--line:#e1e8e3;--red:#b33b35;--green:#28744e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(82px + env(safe-area-inset-bottom))}
header{background:var(--brand);color:#fff;padding:20px 18px 18px;position:sticky;top:0;z-index:5}header .sub{opacity:.75;font-size:12px;letter-spacing:.08em;text-transform:uppercase}header h1{font-size:22px;margin:5px 0 0}
main{max-width:850px;margin:auto;padding:16px}.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom));}
.tabbar button{background:none;color:var(--muted);border:0;font-size:11px;padding:5px 2px;min-width:54px}.tabbar button span{display:block;font-size:19px;margin-bottom:3px}.tabbar button.active{color:var(--brand);font-weight:700}
h2{font-size:20px;margin:5px 0 14px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat,.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}.stat b{display:block;font-size:25px;margin-top:7px}.stat .label{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn{border:0;border-radius:10px;background:var(--brand);color:#fff;padding:11px 14px;font-weight:600;font-size:14px}.btn.secondary{background:#e9efeb;color:var(--brand)}.btn.danger{background:#f8e9e7;color:var(--red)}.btn.smallbtn{padding:7px 10px;font-size:12px}
input,select,textarea{width:100%;border:1px solid #d6dfd9;border-radius:10px;padding:11px;background:#fff;color:var(--ink);font:inherit;margin-top:5px}textarea{min-height:76px;resize:vertical}label{display:block;font-size:13px;font-weight:600;margin:11px 0;color:#344640}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}
.search{margin:10px 0 14px}.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0}.itemtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.item h3{font-size:16px;margin:0 0 5px}.tag{display:inline-block;background:#edf3ef;color:#315b48;border-radius:20px;padding:4px 8px;font-size:11px}.item p{margin:5px 0;color:var(--muted);font-size:13px}.item img{width:68px;height:68px;object-fit:cover;border-radius:9px;float:right;margin-left:8px}.empty{text-align:center;padding:28px 12px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.hidden{display:none!important}.notice{background:#fff8e8;border:1px solid #f0dfb7;border-radius:12px;padding:12px;font-size:13px;margin:12px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1}.modal{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-width:800px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheethead h2{margin:0}.preview{max-width:100px;max-height:100px;object-fit:cover;border-radius:8px;margin-top:8px}
@media(min-width:650px){.modal{align-items:center;padding:20px}.sheet{border-radius:18px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="sub">Your business companion</div><h1>Garment Order Manager</h1></header>
<main id="app"></main>
<nav class="tabbar" aria-label="Main navigation">
<button data-tab="home" class="active"><span>⌂</span>Home</button>
<button data-tab="customers"><span>♙</span>Customers</button>
<button data-tab="vendors"><span>▤</span>Vendors</button>
<button data-tab="orders"><span>▣</span>Orders</button>
<button data-tab="dispatch"><span>⇢</span>Dispatch</button>
<button data-tab="more"><span>⋯</span>More</button>
</nav>
<div id="modal" class="hidden"></div>
<script>
const DB='garment-order-manager-v1', STORE='records';
let db, tab='home', records={customers:[],vendors:[],orders:[],dispatch:[]}, editing=null, photoData='';
const fields={
customers:[['name','Customer / company name','text',1],['contactPerson','Contact person','text'],['visitDate','Visit date','date'],['category','Category','text'],['phone','Contact number','tel'],['email','Email','email'],['gst','GSTIN','text'],['address','Address','textarea',1],['city','City','text'],['state','State','text'],['pin','PIN code','text'],['transport','Preferred transport','text'],['nextFollowup','Next follow-up date','date'],['notes','Notes','textarea',1]],
vendors:[['name','Vendor / company name','text',1],['contactPerson','Contact person','text'],['phone','Contact number','tel'],['email','Email','email'],['gst','GSTIN','text'],['category','Product category','text'],['address','Address','textarea',1],['city','City','text'],['state','State','text'],['pin','PIN code','text'],['transport','Transport details','text'],['paymentTerms','Payment terms','text'],['nextFollowup','Next follow-up date','date'],['notes','Notes','textarea',1]],
orders:[['orderNo','Order number','text',1],['customerId','Customer','customer',1],['bookingDate','Booking date','date'],['product','Product / description','text',1],['category','Category','text'],['quantity','Quantity','number'],['rate','Rate (₹)','number'],['gstRate','GST %','number'],['advance','Advance received (₹)','number'],['dueDate','Committed delivery date','date'],['status','Order status','status'],['notes','Notes','textarea',1]],
dispatch:[['orderId','Order','order',1],['dispatchDate','Dispatch date','date'],['transport','Transport company','text'],['lr','LR / receipt number','text'],['awb','AWB / tracking number','text'],['boxes','Number of boxes','number'],['quantity','Dispatch quantity','number'],['expectedDate','Expected delivery date','date'],['deliveryDate','Actual delivery date','date'],['status','Delivery status','deliveryStatus'],['notes','Remarks','textarea',1]]
};
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(){return new Promise((resolve,reject)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(v){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).put(v);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
function del(id){return new Promise((resolve,reject)=>{let r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=resolve;r.onerror=()=>reject(r.error)})}
async function refresh(){let a=await all();records={customers:[],vendors:[],orders:[],dispatch:[]};a.forEach(x=>{if(records[x.type])records[x.type].push(x)});Object.values(records).forEach(x=>x.sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')));render()}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+(Number(n||0)).toLocaleString('en-IN',{maximumFractionDigits:2});
const nameOf=(type,id)=>records[type].find(x=>x.id===id)?.name||records[type].find(x=>x.id===id)?.orderNo||'—';
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let el=document.getElementById('app');
if(tab==='home'){let pending=records.orders.filter(x=>!['Delivered','Cancelled'].includes(x.status)).length;let late=records.orders.filter(x=>x.dueDate&&x.dueDate<today()&&!['Delivered','Cancelled'].includes(x.status)).length;el.innerHTML=`<h2>Business overview</h2><div class="grid"><div class="stat"><div class="label">Customers</div><b>${records.customers.length}</b></div><div class="stat"><div class="label">Vendors</div><b>${records.vendors.length}</b></div><div class="stat"><div class="label">Active orders</div><b>${pending}</b></div><div class="stat"><div class="label">Overdue orders</div><b>${late}</b></div></div><div class="notice">Your records are stored on this iPhone/browser. Use More → Backup regularly. This first version does not automatically sync to another device.</div><div class="sectionhead"><h2>Quick actions</h2></div><div class="actions"><button class="btn" onclick="showForm('customers')">+ Customer</button><button class="btn" onclick="showForm('vendors')">+ Vendor</button><button class="btn" onclick="showForm('orders')">+ Order</button><button class="btn" onclick="showForm('dispatch')">+ Dispatch</button></div><h2>Recent orders</h2>${records.orders.slice(0,4).map(orderCard).join('')||'<div class="empty">No orders yet. Add your first order.</div>'}`;
}else if(tab==='more'){el.innerHTML=`<h2>More & settings</h2><div class="panel"><h3>Data backup</h3><p class="muted small">Export all customers, vendors, orders, dispatch records and product photos into one JSON backup file. Keep it somewhere safe.</p><div class="actions"><button class="btn" onclick="backup()">Export backup</button><label class="btn secondary" style="margin:0">Restore backup<input type="file" accept=".json,application/json" onchange="restore(event)" hidden></label></div></div><div class="panel" style="margin-top:12px"><h3>How to use</h3><p class="muted">Add customers and vendors first, then create orders. Add dispatch records against an order. Add product or dispatch photos while creating/editing an order or dispatch.</p></div><div class="panel" style="margin-top:12px"><h3>Privacy</h3><p class="muted small">This version stores data locally in this browser on this device. It is not password-protected and does not send your records to a server. Do not clear Safari website data unless you have exported a backup.</p></div>`;
}else{let type=tab;let title={customers:'Customers',vendors:'Vendors',orders:'Orders',dispatch:'Dispatch'}[type];el.innerHTML=`<div class="sectionhead"><h2>${title}</h2><button class="btn" onclick="showForm('${type}')">+ Add</button></div><input class="search" id="search" placeholder="Search ${title.toLowerCase()}…" oninput="filterList()"><div id="list">${listHtml(type)}</div>`}
}
function today(){return new Date().toISOString().slice(0,10)}
function listHtml(type){let arr=records[type];if(!arr.length)return '<div class="empty">Nothing here yet. Tap + Add to create your first record.</div>';return arr.map(x=>type==='orders'?orderCard(x):genericCard(type,x)).join('')}
function orderCard(x){return `<div class="item">${x.photo?`<img src="${x.photo}">`:''}<div class="itemtop"><div><h3>${esc(x.orderNo||'Order')} · ${esc(nameOf('customers',x.customerId))}</h3><span class="tag">${esc(x.status||'Pending')}</span></div><b>${money((Number(x.quantity)||0)*(Number(x.rate)||0))}</b></div><p>${esc(x.product||'')} · Qty ${esc(x.quantity||'—')} · Due ${esc(x.dueDate||'—')}</p><div class="actions"><button class="btn secondary smallbtn" onclick="showForm('orders','${x.id}')">Edit</button><button class="btn secondary smallbtn" onclick="showForm('dispatch',null,'${x.id}')">Add dispatch</button><button class="btn danger smallbtn" onclick="removeRecord('${x.id}')">Delete</button></div></div>`}
function genericCard(type,x){let title=x.name||nameOf('orders',x.orderId)||'Dispatch';let detail=type==='customers'?[x.phone,x.city,x.category].filter(Boolean).join(' · '):type==='vendors'?[x.phone,x.category].filter(Boolean).join(' · '):[x.transport,x.awb,x.status].filter(Boolean).join(' · ');return `<div class="item">${x.photo?`<img src="${x.photo}">`:''}<div class="itemtop"><div><h3>${esc(title)}</h3><p>${esc(detail||x.address||x.product||'')}</p>${type==='dispatch'?`<span class="tag">${esc(x.status||'In transit')}</span>`:''}</div></div><div class="actions"><button class="btn secondary smallbtn" onclick="showForm('${type}','${x.id}')">Edit</button><button class="btn danger smallbtn" onclick="removeRecord('${x.id}')">Delete</button></div></div>`}
function filterList(){let q=document.getElementById('search').value.toLowerCase();let type=tab;document.getElementById('list').innerHTML=records[type].filter(x=>JSON.stringify(x).toLowerCase().includes(q)||nameOf('customers',x.customerId).toLowerCase().includes(q)||nameOf('orders',x.orderId).toLowerCase().includes(q)).map(x=>type==='orders'?orderCard(x):genericCard(type,x)).join('')||'<div class="empty">No matching records.</div>'}
function fieldHtml(f,v){let [k,label,kind,full]=f;let attr=`name="${k}"`;let value=esc(v??'');let input='';
if(kind==='textarea')input=`<textarea ${attr}>${value}</textarea>`;
else if(kind==='customer')input=`<select ${attr}><option value="">Choose customer</option>${records.customers.map(c=>`<option value="${c.id}" ${v===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`;
else if(kind==='order')input=`<select ${attr}><option value="">Choose order</option>${records.orders.map(o=>`<option value="${o.id}" ${v===o.id?'selected':''}>${esc(o.orderNo)} – ${esc(o.product)}</option>`).join('')}</select>`;
else if(kind==='status'||kind==='deliveryStatus'){let opts=kind==='status'?['Pending','In Production','Ready','Partially Dispatched','Dispatched','Delivered','Cancelled']:['Ready to dispatch','In transit','Delivered','Delayed'];input=`<select ${attr}>${opts.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`}
else input=`<input ${attr} type="${kind}" value="${value}" ${kind==='number'?'step="any"':''}>`;
return `<label class="${full?'full':''}">${label}${input}</label>`}
function showForm(type,id=null,preOrder=null){editing=id;let old=id?records[type].find(x=>x.id===id)||{}:{};if(preOrder)old={...old,orderId:preOrder};photoData=old.photo||'';let title=(id?'Edit ':'Add ')+({customers:'customer',vendors:'vendor',orders:'order',dispatch:'dispatch'}[type]);document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeForm()"><div class="sheet"><div class="sheethead"><h2>${title}</h2><button class="btn secondary" onclick="closeForm()">Close</button></div><form id="recordForm" onsubmit="saveForm(event,'${type}','${id||''}')"><div class="formgrid">${fields[type].map(f=>fieldHtml(f,old[f[0]])).join('')}<label class="full">Photo (optional)<input id="photoInput" type="file" accept="image/*" capture="environment" onchange="readPhoto(event)"><img id="photoPreview" class="preview ${photoData?'':'hidden'}" src="${photoData}"></label></div><div class="actions"><button class="btn" type="submit">Save ${title.replace(/^(Add|Edit) /,'')}</button><button class="btn secondary" type="button" onclick="closeForm()">Cancel</button></div></form></div></div>`}
function readPhoto(e){let f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024){alert('Please choose an image smaller than 5 MB.');e.target.value='';return}let r=new FileReader();r.onload=()=>{photoData=r.result;let p=document.getElementById('photoPreview');p.src=photoData;p.classList.remove('hidden')};r.readAsDataURL(f)}
async function saveForm(e,type,id){e.preventDefault();let obj={};new FormData(e.target).forEach((v,k)=>obj[k]=v);obj.id=id||crypto.randomUUID();obj.type=type;obj.photo=photoData;obj.updated=new Date().toISOString();if(type==='orders'){obj.total=Number(obj.quantity||0)*Number(obj.rate||0);obj.balance=Math.max(0,obj.total-Number(obj.advance||0))}await put(obj);closeForm();await refresh()}
function closeForm(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML='';editing=null;photoData=''}
async function removeRecord(id){if(confirm('Delete this record? This cannot be undone unless you have a backup.')){await del(id);refresh()}}
async function backup(){let data=await all();let blob=new Blob([JSON.stringify({app:'Garment Order Manager',version:1,exported:new Date().toISOString(),records:data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='garment-manager-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
async function restore(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.records))throw Error('Invalid backup');if(!confirm('Restore '+data.records.length+' records? Existing records with the same IDs will be replaced.'))return;for(let x of data.records)await put(x);await refresh();alert('Backup restored.')}catch(err){alert('Could not restore: '+err.message)}e.target.value=''}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));
(async()=>{db=await openDB();await refresh();if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script>
</body></html>
